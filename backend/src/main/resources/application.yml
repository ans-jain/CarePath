spring:
  application:
    name: carepath-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carepath}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name:-carepath-backend},%X{requestId:-NONE},%X{userId:-NONE}] [%thread] %logger{36} : %msg%n"
  level:
    root: INFO
    com.carepath: DEBUG
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    rate-limiting:
      enabled: ${RATE_LIMITING_ENABLED:true}
      auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:30}
      ml-limit-per-minute: ${RATE_LIMIT_ML_PER_MIN:60}
      default-limit-per-minute: ${RATE_LIMIT_DEFAULT_PER_MIN:120}
  notifications:
    email:
      provider: ${EMAIL_PROVIDER:console}
      from: ${EMAIL_FROM:noreply@carepath.io}
    reminders:
      enabled: ${NOTIFICATIONS_REMINDERS_ENABLED:true}


